<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Bé Tự Làm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: một bảng việc lớn, thẻ to dễ chạm; đầu trang đổi màu theo buổi sáng / chiều / tối;
   khu vực bố mẹ là tấm phủ toàn màn hình sau mã PIN. Chữ tự lớn dần theo chiều rộng màn hình (TV). */
:root{
  --bg:#E8F3FD; --surface:#FFFFFF; --surface-2:#F1F7FE; --ink:#1B2A41; --muted:#56667E;
  --line:#CBDDF0; --shadow:#B7CFE8; --bubble:#F1F7FE;
  --morning:#F59A0C; --morning-soft:#FFEFD1;
  --afternoon:#1699D6; --afternoon-soft:#DAF1FB;
  --evening:#7050E8; --evening-soft:#E7E0FF;
  --good:#169E67; --good-soft:#D6F4E6; --on-good:#FFFFFF;
  --btn:#2563EB; --on-btn:#FFFFFF; --focus:#0B5BDB; --danger:#C93131; --danger-soft:#FFE3E3;
  --i-y:#FFC93C; --i-r:#FF6B6B; --i-b:#5CC3F5; --i-g:#5BD6A0; --i-p:#A78BFA; --i-s:#FFD3B0;
  --i-w:#FFFFFF; --i-k:#1B2A41; --i-o:#F59E42; --i-line:#1B2A41;
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,sans-serif;
  --ky:#E39B00; --ky-s:#FFF1C7; --ky-bg:#FFF6DC;
  --kr:#E5484D; --kr-s:#FFE0E1; --kr-bg:#FFEDEE;
  --kb:#1E88E5; --kb-s:#DCEEFF; --kb-bg:#E8F3FD;
  --kg:#1FA971; --kg-s:#D6F4E6; --kg-bg:#E6F7EF;
  --kp:#7C5CE6; --kp-s:#E9E2FF; --kp-bg:#EFEAFF;
  font-size:clamp(16px,0.6vw + 11px,26px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1830; --surface:#18243F; --surface-2:#1E2D4D; --ink:#EAF1FF; --muted:#A3B3CF;
    --line:#2D3E66; --shadow:#080E1E; --bubble:#EAF1FF;
    --morning:#FFB340; --morning-soft:#3B2E17; --afternoon:#4CC3F0; --afternoon-soft:#143347;
    --evening:#A592FF; --evening-soft:#2B2759; --good:#3DDC97; --good-soft:#143D2E; --on-good:#0B2A1D;
    --btn:#FFD166; --on-btn:#1B2A41; --focus:#FFD166; --danger:#FF8A8A; --danger-soft:#4A2226;
    --i-k:#0B1220; --i-line:#0B1220; color-scheme:dark;
  --ky:#FFC93C; --ky-s:#3A3016; --ky-bg:#1F1A0B;
  --kr:#FF8083; --kr-s:#4A2226; --kr-bg:#261416;
  --kb:#5CB8FF; --kb-s:#14304A; --kb-bg:#0F1830;
  --kg:#4BDDA0; --kg-s:#123D2E; --kg-bg:#0C2018;
  --kp:#AD97FF; --kp-s:#2D2759; --kp-bg:#191531;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1830; --surface:#18243F; --surface-2:#1E2D4D; --ink:#EAF1FF; --muted:#A3B3CF;
  --line:#2D3E66; --shadow:#080E1E; --bubble:#EAF1FF;
  --morning:#FFB340; --morning-soft:#3B2E17; --afternoon:#4CC3F0; --afternoon-soft:#143347;
  --evening:#A592FF; --evening-soft:#2B2759; --good:#3DDC97; --good-soft:#143D2E; --on-good:#0B2A1D;
  --btn:#FFD166; --on-btn:#1B2A41; --focus:#FFD166; --danger:#FF8A8A; --danger-soft:#4A2226;
  --i-k:#0B1220; --i-line:#0B1220; color-scheme:dark;
  --ky:#FFC93C; --ky-s:#3A3016; --ky-bg:#1F1A0B;
  --kr:#FF8083; --kr-s:#4A2226; --kr-bg:#261416;
  --kb:#5CB8FF; --kb-s:#14304A; --kb-bg:#0F1830;
  --kg:#4BDDA0; --kg-s:#123D2E; --kg-bg:#0C2018;
  --kp:#AD97FF; --kp-s:#2D2759; --kp-bg:#191531;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:700 1rem/1.4 var(--f-body);
  padding-block:1rem 3rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.muted{color:var(--muted);font-weight:600}
svg{display:block}
.ill{stroke:var(--i-line);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}

/* ---------- màn hình của bé ---------- */
.app{max-width:80rem;margin:0 auto}
/* Màu chủ đạo của cả trang đổi theo màu của bé đang chọn */
body{--p:var(--kb);--ps:var(--kb-s);--bg:var(--kb-bg)}
body[data-kc="y"]{--p:var(--ky);--ps:var(--ky-s);--bg:var(--ky-bg)}
body[data-kc="r"]{--p:var(--kr);--ps:var(--kr-s);--bg:var(--kr-bg)}
body[data-kc="b"]{--p:var(--kb);--ps:var(--kb-s);--bg:var(--kb-bg)}
body[data-kc="g"]{--p:var(--kg);--ps:var(--kg-s);--bg:var(--kg-bg)}
body[data-kc="p"]{--p:var(--kp);--ps:var(--kp-s);--bg:var(--kp-bg)}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem;background:var(--ps);border:3px solid var(--p);border-radius:2rem;padding:1rem 1.25rem}
.who{display:flex;align-items:center;gap:1rem;flex:1 1 18rem;min-width:0}
.mascot{width:5.5rem;height:5.5rem;flex:none;animation:bob 3.6s ease-in-out infinite}
.mascot .m-open{display:none}
.mascot.happy .m-open{display:block}
.mascot.happy .m-smile{display:none}
.hello{font:800 clamp(1.5rem,4.6vw,2.6rem)/1.1 var(--f-display);text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.sub{margin-top:.2rem;color:var(--muted);font-weight:700}
.clock{text-align:right;flex:none}
.clock b{display:block;font:800 clamp(2rem,6vw,3.4rem)/1 var(--f-display);font-variant-numeric:tabular-nums}
.clock span{color:var(--muted);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;flex:1 1 100%}
.chip{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .95rem;border-radius:99px;background:var(--surface);border:3px solid var(--line);font:800 .95rem var(--f-display);box-shadow:0 .2rem 0 var(--shadow)}
.chip svg{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.attn{border-color:var(--p);animation:nudge 1.8s ease-in-out infinite}
.chip.sync{box-shadow:none;font-size:.85rem;color:var(--muted)}
.chip.sync.bad{border-color:var(--danger);color:var(--danger)}

.kids{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.kidchip{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem .35rem .4rem;border-radius:99px;background:var(--surface);border:3px solid var(--line);font:800 1.05rem var(--f-display)}
.kidchip[aria-pressed="true"]{border-color:var(--p);background:var(--ps)}
.avatar{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;font:800 1.1rem var(--f-display);color:#1B2A41;flex:none;border:2px solid var(--i-line)}

.periods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin-top:1rem}
.ptab{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.7rem .4rem;background:var(--surface);border:3px solid var(--line);border-radius:1.5rem;box-shadow:0 .25rem 0 var(--shadow);text-align:center}
.ptab .ill{width:2.4rem;height:2.4rem}
.ptab b{font:800 1.1rem/1.1 var(--f-display)}
.ptab .txt{display:flex;flex-direction:column;align-items:center}
.ptab small{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.ptab.morning{--c:var(--morning);--cs:var(--morning-soft)}
.ptab.afternoon{--c:var(--afternoon);--cs:var(--afternoon-soft)}
.ptab.evening{--c:var(--evening);--cs:var(--evening-soft)}
.ptab[aria-selected="true"]{background:var(--ps);border-color:var(--p)}
@media (min-width:40rem){.ptab{flex-direction:row;justify-content:center;gap:.8rem;padding:.8rem 1rem}.ptab .txt{align-items:flex-start}}

.board{margin-top:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10.5rem),1fr));gap:.9rem}
.task{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;min-height:12.5rem;padding:1.1rem .6rem .9rem;min-width:0;background:var(--surface);border:3px solid var(--line);border-radius:1.75rem;box-shadow:0 .3rem 0 var(--shadow);text-align:center;transition:transform .12s,background .2s,border-color .2s}
.task:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 var(--shadow)}
.bubble{display:grid;place-items:center;width:5.2rem;height:5.2rem;border-radius:50%;background:var(--bubble);border:2px solid var(--line);flex:none}
.bubble .ill{width:3.6rem;height:3.6rem}
.bubble.sm{width:2.8rem;height:2.8rem}
.bubble.sm .ill{width:2rem;height:2rem}
.t-title{font:700 1.12rem/1.2 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.t-tag{font:800 .85rem var(--f-body);padding:.1rem .6rem;border-radius:99px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.5rem}
.t-tag:empty{visibility:hidden}
.tick{position:absolute;top:.6rem;right:.6rem;display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;border:3px solid var(--line);background:var(--surface-2)}
.tick svg{width:1.3rem;height:1.3rem;fill:none;stroke:var(--on-good);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s}
.task.done{background:var(--good-soft);border-color:var(--good)}
.task.done .tick{background:var(--good);border-color:var(--good)}
.task.done .tick svg{opacity:1;transform:scale(1)}
.task.done .t-tag{background:var(--good);color:var(--on-good)}
.task.pop .bubble{animation:pop .5s}
.empty{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:2rem 1rem;text-align:center;background:var(--surface);border:3px dashed var(--line);border-radius:1.75rem}
.empty .mascot{width:6rem;height:6rem}
.empty p{font:700 1.2rem/1.3 var(--f-display);max-width:24rem}

.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:.9rem;margin-top:1.25rem}
.meter{background:var(--surface);border:3px solid var(--line);border-radius:1.5rem;padding:.9rem 1rem;min-width:0}
.meter h3{font:800 1.05rem var(--f-display);display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.meter h3 span{color:var(--muted);font-family:var(--f-body);font-variant-numeric:tabular-nums}
.bar{height:1.1rem;margin-top:.5rem;border-radius:99px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--p);border-radius:99px;transition:width .4s}
.meter p{margin-top:.45rem;font-weight:700;color:var(--muted)}
.stars{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.5rem}
.stars svg{width:1.7rem;height:1.7rem;stroke-width:2;stroke-linejoin:round}
.stars .on{fill:var(--i-y);stroke:var(--i-line)}
.stars .off{fill:none;stroke:var(--line)}

/* ---------- nhìn lại ---------- */
.rt{margin-top:1rem}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.monthnav b{font:800 1.2rem var(--f-display);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.35rem}
.dow{text-align:center;font-weight:800;color:var(--muted);font-size:.85rem}
.day{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:.05rem;min-height:3.8rem;padding:.25rem .1rem;border-radius:.9rem;border:3px solid var(--line);background:var(--surface);font:800 1rem var(--f-display)}
.day i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--pct)*1%);background:var(--p);opacity:.45}
.day span,.day small{position:relative}
.day small{font:800 .72rem var(--f-body);color:var(--muted);min-height:1rem}
.day.blank{border:0;background:none;visibility:hidden}
.day.today{box-shadow:0 0 0 3px var(--p)}
.day[aria-pressed="true"]{border-color:var(--ink)}
.day:disabled{opacity:.35;cursor:default}
.drow{display:flex;align-items:center;gap:.7rem;padding:.4rem .7rem .4rem .4rem;border-radius:1.1rem;background:var(--surface-2);font:700 1rem var(--f-display)}
.drow.ok{background:var(--good-soft)}
.drow .st{margin-left:auto;font:800 .85rem var(--f-body);color:var(--muted)}
.drow.ok .st{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem}
.legend span{display:inline-flex;align-items:center;gap:.4rem;font-weight:800}
.legend i{display:block;width:1rem;height:1rem;border-radius:.3rem;border:2px solid var(--line)}
.chart{display:flex;gap:.9rem;overflow-x:auto;padding-bottom:.3rem}
.grp{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:none}
.bars{display:flex;align-items:stretch;gap:.25rem;height:11rem;border-bottom:3px solid var(--line)}
.col{width:1.9rem;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.15rem}
.col .v{font:800 .8rem var(--f-body);font-variant-numeric:tabular-nums}
.col i{display:block;width:100%;height:calc(var(--h)*1%);min-height:3px;border:2px solid var(--line);border-bottom:0;border-radius:.5rem .5rem 0 0}
.gl{font:800 .8rem var(--f-body);color:var(--muted);white-space:nowrap}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:20rem}
th,td{padding:.55rem .5rem;text-align:left;border-bottom:2px solid var(--line);vertical-align:middle}
thead th{font-size:.85rem;color:var(--muted)}
th .avatar{display:inline-grid;vertical-align:middle;margin-right:.4rem}
td small{color:var(--muted);font-weight:700}
.bd{font-style:normal;font-weight:800;font-size:.75rem;padding:.05rem .5rem;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.bd.ok{background:var(--good-soft);color:var(--good)}
.bd.no{background:var(--danger-soft);color:var(--danger)}
.cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:.7rem}
.cardrow .card b{font:800 1.5rem var(--f-display)}
.sw-c:disabled{opacity:.25;cursor:not-allowed}
.btn:disabled{opacity:.4;cursor:default}
.rcard{display:flex;flex-direction:column;gap:.7rem;padding:.8rem;background:var(--surface-2);border-radius:1.2rem}
.rk{font:800 1.1rem var(--f-display);text-align:left;width:100%}

/* ---------- lớp phủ ---------- */
.scrim{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:auto;background:rgba(10,16,34,.66);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{position:relative;overflow:hidden;width:min(100%,34rem);background:var(--surface);border:4px solid var(--p,var(--line));border-radius:2rem;padding:1.5rem 1.25rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.dialog .mascot{width:7rem;height:7rem}
.dialog h2{font:800 clamp(1.6rem,6vw,2.3rem)/1.1 var(--f-display);text-wrap:balance}
.dialog p{color:var(--muted)}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;width:100%;text-align:left}
.rlist li{display:flex;align-items:center;gap:.7rem;padding:.4rem .7rem .4rem .4rem;background:var(--surface-2);border-radius:1.2rem;font:700 1.05rem var(--f-display)}
.fall{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fall i{position:absolute;top:-2rem;left:var(--x);width:var(--s);height:var(--s);background:var(--i-y);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:fall 2.8s linear var(--d) infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.1rem;border-radius:1rem;background:var(--surface);border:3px solid var(--line);box-shadow:0 .2rem 0 var(--shadow);font:800 1rem var(--f-display)}
.btn:active{transform:translateY(.12rem);box-shadow:0 .08rem 0 var(--shadow)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.btn.big{font-size:1.3rem;padding:.8rem 1.6rem;margin-top:.3rem}
.btn.sm{padding:.4rem .8rem;font-size:.9rem;border-radius:.8rem}
.btn.danger{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.pindots{display:flex;gap:.8rem;margin:.2rem 0}
.pindots i{width:1.4rem;height:1.4rem;border-radius:50%;border:3px solid var(--ink);display:block}
.pindots i.on{background:var(--ink)}
.pinerr{color:var(--danger);font-weight:800;min-height:1.4rem}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;width:min(100%,18rem)}
.keypad .btn{font-size:1.5rem;padding:.7rem 0}

/* ---------- khu vực bố mẹ ---------- */
.sheet{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);
  padding:calc(1rem + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(3rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:56rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.sheet-head h2{font:800 1.7rem/1.1 var(--f-display)}
.ptabs{display:flex;flex-wrap:wrap;gap:.5rem}
.ptabs button{padding:.5rem 1rem;border-radius:99px;border:3px solid var(--line);background:var(--surface);font:800 .95rem var(--f-display)}
.ptabs button[aria-selected="true"]{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.pbody{display:flex;flex-direction:column;gap:1rem}
.psec{background:var(--surface);border:3px solid var(--line);border-radius:1.5rem;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.psec h3{display:flex;align-items:center;gap:.6rem;font:800 1.15rem var(--f-display)}
.psec h3 .ill{width:2rem;height:2rem}
.psec h3 small{margin-left:auto;color:var(--muted);font-family:var(--f-body)}
.trow,.krow,.rrow{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem .8rem;padding:.5rem;background:var(--surface-2);border-radius:1.1rem}
.tinfo{flex:1 1 10rem;min-width:0}
.tinfo b{display:block;font:700 1.05rem/1.2 var(--f-display);overflow-wrap:anywhere}
.tinfo small{color:var(--muted);font-weight:700}
.tbtns{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.ib{width:2.2rem;height:2.2rem;border-radius:.7rem;border:3px solid var(--line);background:var(--surface);font-size:.8rem}
.row-between{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:space-between;align-items:end}
.fld{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.fld>span{font-weight:800;color:var(--muted);font-size:.9rem}
.fld.grow{flex:1 1 10rem}
input,select,textarea{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:3px solid var(--line);border-radius:.9rem;padding:.55rem .8rem;width:100%;min-width:0}
textarea{resize:vertical;min-height:6rem;font-size:.85rem;word-break:break-all}
.card{background:var(--surface);border:3px solid var(--line);border-radius:1.5rem;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.card h3{font:800 1.15rem var(--f-display)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr));gap:.5rem}
.icopick{display:grid;place-items:center;padding:.3rem;border-radius:1rem;border:3px solid var(--line);background:var(--bubble)}
.icopick .ill{width:2.8rem;height:2.8rem}
.icopick[aria-pressed="true"]{border-color:var(--btn);box-shadow:0 0 0 3px var(--btn)}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.pill{padding:.45rem .9rem;border-radius:99px;border:3px solid var(--line);background:var(--surface);font:800 .95rem var(--f-display)}
.pill[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.swatches{display:flex;gap:.4rem}
.sw-c{width:2.2rem;height:2.2rem;border-radius:50%;border:3px solid var(--line)}
.sw-c.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
.sw{appearance:none;-webkit-appearance:none;width:3.2rem;height:1.8rem;border-radius:99px;padding:0;border:3px solid var(--line);background:var(--surface-2);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:.1rem;left:.15rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw:checked{background:var(--good);border-color:var(--good)}
.sw:checked::after{transform:translateX(1.35rem);background:var(--on-good)}
.line{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.status{padding:.6rem .9rem;border-radius:1rem;background:var(--good-soft);border:3px solid var(--good);font-weight:800}
.hint{color:var(--muted);font-weight:600;font-size:.92rem}

@keyframes bob{50%{transform:translateY(-.3rem)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1)}}

function normalize(s){
  const d=defaults(), o=Object.assign({},d,s);
  o.reminders=Array.isArray(s.reminders)?s.reminders:d.reminders;
  o.reminders.forEach(r=>{
    if(!Array.isArray(r.days)||!r.days.length)r.days=ALL.slice();
    if(!r.kid)r.kid='all';
    r.repeat=[0,5,10,15,30].includes(+r.repeat)?+r.repeat:0;
    if(typeof r.msg!=='string')r.msg='';
  });
  if(typeof o.taskRemind!=='boolean')o.taskRemind=false;
  o.reward=Object.assign({},d.reward,s.reward||{});
  o.done=(s.done&&typeof s.done==='object')?s.done:{};
  o.plan=(s.plan&&typeof s.plan==='object')?s.plan:{};
  o.snap=(s.snap&&typeof s.snap==='object')?s.snap:{};

  if(typeof o.showMoney!=='boolean')o.showMoney=true;
  o.tasks.forEach(t=>{if(!Array.isArray(t.days)||!t.days.length)t.days=ALL.slice();if(!t.kid)t.kid='all';});

/* cfg/main: việc, bé, chuông, thưởng (chỉ Editor ghi). days/<ngày>: tick, kế hoạch, tên việc (Contributor ghi). */
const sync={db:null,admin:false,canWrite:true,cfgSeen:false,daysSeen:false,err:false,mode:'',standalone:false};

  return JSON.stringify(v);
}

function syncLabel(){
  if(!sync.db)return (sync.err&&sync.mode==='firebase')?'Không kết nối được Firebase':'Lưu trên máy này';
  if(sync.err)return 'Mất đồng bộ, đang lưu trên máy';
  if(!(sync.cfgSeen&&sync.daysSeen))return 'Đang kết nối...';
  if(!sync.canWrite)return 'Chỉ xem, chưa ghi được';
  return 'Đã đồng bộ';
}
function syncBad(){return !!((sync.db||sync.mode==='firebase')&&(sync.err||!sync.canWrite));}
function showSync(){const c=document.getElementById('syncChip');if(c){c.textContent=syncLabel();c.classList.toggle('bad',syncBad());}}
function enqueue(fn){chain=chain.then(fn).catch(()=>{});return chain;}
async function tryWrite(fn){
  try{await fn();}
  catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*600));await fn();}else throw e;}
}
function writeErr(e){
  if(e&&e.code==='invalid_argument')sync.canWrite=false;else sync.err=true;
  showSync();
}
function dayDoc(dk){
  const done=clone(state.done[dk]||{}),plan=clone(state.plan[dk]||{}),ids={};
  Object.values(plan).concat(Object.values(done)).forEach(a=>(a||[]).forEach(i=>{ids[i]=1;}));
  const snap={};Object.keys(ids).forEach(i=>{if(state.snap[i])snap[i]=state.snap[i];});
  return {d:dk,done,plan,snap};
}
function queueDay(dk){
  if(!sync.db||!sync.canWrite||!sync.daysSeen)return;
  const o=dayDoc(dk);
  if(!Object.values(o.plan).concat(Object.values(o.done)).some(a=>a&&a.length))return;
  const j=stable(o);
  if(known[dk]===j)return;
  known[dk]=j;pending[dk]=(pending[dk]||0)+1;
  enqueue(async()=>{
    try{await tryWrite(()=>sync.db.doc('days/'+dk).set(o));if(sync.err){sync.err=false;}}
    catch(e){delete known[dk];writeErr(e);}
    finally{pending[dk]--;showSync();}
  });
}
function schedCfg(){
  if(!sync.db||!sync.admin||!sync.cfgSeen)return;
  clearTimeout(cfgTimer);cfgTimer=setTimeout(pushCfg,700);
}
function pushCfg(){
  cfgTimer=null;
  if(!sync.db||!sync.admin)return;
  const o=clone(cfgOf(state)),j=stable(o);
  if(j===knownCfg)return;
  knownCfg=j;
  enqueue(async()=>{
    try{await tryWrite(()=>sync.db.doc('cfg/main').set(o));if(sync.err){sync.err=false;}}
    catch(e){knownCfg=null;writeErr(e);}
    showSync();
  });
}
function applyCfg(d){
  const n=normalize(Object.assign({},clone(d),{active:state.active,done:state.done,plan:state.plan,snap:state.snap}));
  const j=stable(cfgOf(n));
  if(j===stable(cfgOf(state))){knownCfg=j;return;}
  Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,n);
  knownCfg=j;save();render();
}
function onCfg(snap){
  const cache=!!(snap.metadata&&snap.metadata.fromCache);
  if(!snap.exists){
    if(cache)return;
    sync.cfgSeen=true;
    if(sync.admin)pushCfg();
    showSync();return;
  }
  sync.cfgSeen=true;
  if(cfgTimer||(pp&&sync.admin)){showSync();return;}
  const d=snap.data();
  if(d&&Array.isArray(d.kids)&&d.kids.length&&Array.isArray(d.tasks))applyCfg(d);
  showSync();
}
function onDays(snap){
  let changed=false;
  snap.docs.forEach(doc=>{
    if(!doc.exists)return;
    const dk=doc.id;if(pending[dk]>0)return;
    const x=doc.data()||{};
    const o={d:dk,done:(x.done&&typeof x.done==='object')?clone(x.done):{},plan:(x.plan&&typeof x.plan==='object')?clone(x.plan):{},snap:(x.snap&&typeof x.snap==='object')?clone(x.snap):{}};
    const j=stable(o);
    if(known[dk]===j)return;
    if(known[dk]===undefined&&state.done[dk]){
      Object.keys(state.done[dk]).forEach(kid=>{
        const a=o.done[kid]||[];
        (state.done[dk][kid]||[]).forEach(id=>{if(a.indexOf(id)<0)a.push(id);});
        o.done[kid]=a;
      });
    }
    state.done[dk]=o.done;state.plan[dk]=o.plan;Object.assign(state.snap,o.snap);
    known[dk]=j;changed=true;
  });
  const cache=!!(snap.metadata&&snap.metadata.fromCache);
  const first=!sync.daysSeen&&!cache;
  if(first){
    sync.daysSeen=true;
    if(sync.canWrite)Object.keys(state.done).forEach(dk=>{if(known[dk]===undefined)queueDay(dk);});
  }
  if(changed||first){save();render();}
  showSync();
}

function fbSettings(){
  const s=readFb(),cfg=s.cfg||BAKED_FB;
  return (cfg&&cfg.apiKey&&cfg.projectId&&s.code)?{cfg,code:s.code}:null;
}
function parseFbConfig(text){
  try{const o=JSON.parse(text);if(o&&o.apiKey&&o.projectId)return o;}catch(e){}
  const o={},re=/([A-Za-z]+)\s*:\s*["']([^"']+)["']/g;let m;
  while((m=re.exec(text)))o[m[1]]=m[2];
  return (o.apiKey&&o.projectId)?o:null;
}
function genCode(){
  const A='abcdefghjkmnpqrstuvwxyz23456789',b=new Uint8Array(12);
  try{crypto.getRandomValues(b);}catch(e){for(let i=0;i<12;i++)b[i]=Math.floor(Math.random()*256);}
  return Array.from(b).map(x=>A[x%A.length]).join('');
}
(function hashCode(){
  try{
    const m=/[#&]f=([A-Za-z0-9_-]{6,40})/.exec(location.hash||'');
    if(m){const cur=readFb();writeFb({cfg:cur.cfg,code:m[1].toLowerCase()});history.replaceState(null,'',location.pathname+location.search);}
  }catch(e){}
})();
function loadScript(src){
  return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('load'));document.head.appendChild(el);});
}
async function fbDb(fb){
  await loadScript(FB_SDK+'firebase-app-compat.js');
  await loadScript(FB_SDK+'firebase-firestore-compat.js');
  const app=(firebase.apps&&firebase.apps.length)?firebase.app():firebase.initializeApp(fb.cfg);
  const fs=firebase.firestore(app);
  try{await fs.enablePersistence({synchronizeTabs:true});}catch(e){}
  const root='families/'+fb.code+'/',opt={includeMetadataChanges:true};
  const wq=q=>({orderBy:(f,d)=>wq(q.orderBy(f,d)),limit:n=>wq(q.limit(n)),onSnapshot:(n,e)=>q.onSnapshot(opt,n,e)});
  return {
    doc:p=>{const r=fs.doc(root+p);return {set:o=>r.set(o),onSnapshot:(n,e)=>r.onSnapshot(opt,n,e)};},
    collection:c=>wq(fs.collection(root+c))
  };
}
async function initSync(){
  let db=null,user=null;
  sync.standalone=!(window.claude&&typeof window.claude.use==='function');
  try{
    const c=window.claude;
    if(c&&typeof c.use==='function'){db=await c.use('db');if(db)user=await c.use('user');}
  }catch(e){}
  if(db){
    sync.mode='claude';
    try{
      sync.admin=user?!!(await user.canEdit()):false;
      const w=user?await user.can('data.write'):null;
      sync.canWrite=(w!==false);
    }catch(e){}
  }else{
    const fb=fbSettings();
    if(!fb)return;
    sync.mode='firebase';sync.admin=true;sync.canWrite=true;
    try{db=await fbDb(fb);}catch(e){sync.err=true;showSync();return;}
  }
  sync.db=db;showSync();
  const fail=()=>{sync.err=true;showSync();};
  try{
    db.doc('cfg/main').onSnapshot(onCfg,fail);
    db.collection('days').orderBy('d','desc').limit(400).onSnapshot(onDays,fail);
  }catch(e){fail();}
}

const activeKid=()=>state.kids.find(k=>k.id===state.active)||state.kids[0];
function tasksFor(kidId,period,date){
  const wd=date.getDay();
  return state.tasks.filter(t=>t.period===period&&(t.kid==='all'||t.kid===kidId)&&t.days.includes(wd));
}
const doneIds=(dk,kidId)=>((state.done[dk]||{})[kidId])||[];
/* ---- ghi nhật ký theo ngày, thống kê, tiền thưởng ---- */
const fmt=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const weekStart=d=>{const x=dayStart(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const dm=d=>d.getDate()+'/'+(d.getMonth()+1);
function starsRange(kidId,from,to){let n=0;for(let d=dayStart(from);d<=to;d=addDays(d,1))n+=doneIds(keyOf(d),kidId).length;return n;}
function plannedRange(kidId,from,to){
  let n=0;
  for(let d=dayStart(from);d<=to;d=addDays(d,1)){const k=keyOf(d);n+=Math.max((((state.plan[k]||{})[kidId])||[]).length,doneIds(k,kidId).length);}
  return n;
}
const weekStars=(kidId,now)=>starsRange(kidId,weekStart(now),now);
const moneyOn=()=>state.money.rate>0;
function moneyFor(stars){
  const m=state.money;let base=stars*m.rate;if(m.cap>0)base=Math.min(base,m.cap);
  const bonus=(m.bonus>0&&stars>=state.reward.target)?m.bonus:0;
  return {base,bonus,total:base+bonus};
}
function weeksList(n){
  const ws=weekStart(new Date()),out=[];
  for(let i=0;i<n;i++){const s=addDays(ws,-7*i);out.push({i,s,e:addDays(s,6),wk:keyOf(s)});}
  return out;
}
function ensurePlan(now){
  const dk=keyOf(now);
  state.tasks.forEach(t=>{state.snap[t.id]={t:t.title,i:t.icon,p:t.period};});
  const before=stable(state.plan[dk]||{}),plan={};
  state.kids.forEach(k=>{plan[k.id]=PERIODS.reduce((a,p)=>a.concat(tasksFor(k.id,p.id,now).map(t=>t.id)),[]);});
  state.plan[dk]=plan;
  if(stable(plan)!==before)save();
  queueDay(dk);
}
function info(id){
  const f=state.snap[id];if(f)return f;
  const t=state.tasks.find(x=>x.id===id);
  return t?{t:t.title,i:t.icon,p:t.period}:{t:'Việc đã xóa',i:'star',p:'morning'};
}

let unlocked=false,actx=null,wl=null;
function ctx(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return actx;}
function tone(f,t0,dur,type,vol){
  const c=ctx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
function sfx(kind){
  if(!state.sound||!unlocked)return;
  try{
    const c=ctx();if(c&&c.state==='suspended')c.resume();
    if(kind==='pop'){tone(740,0,.12);tone(1110,.07,.16);}
    else if(kind==='cheer'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.32,'triangle'));}
    else if(kind==='bell'){[659,784,988,784,988,1319].forEach((f,i)=>tone(f,i*.2,.45,'triangle',.2));}
  }catch(e){}
}
function say(text){
  if(!state.speak||!unlocked)return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
async function wake(){
  try{if('wakeLock' in navigator&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen');}catch(e){}
}
function unlock(){
  if(unlocked)return;
  unlocked=true;
  try{const c=ctx();if(c&&c.state==='suspended')c.resume();}catch(e){}
  wake();
  const b=$('#bellTxt');if(b)b.textContent='Chuông đã bật';
  const bb=$('[data-act="bell"]');if(bb)bb.classList.remove('attn');
}

function buckets(mode,now){
  const out=[];
  if(mode==='day'){for(let i=6;i>=0;i--){const d=dayStart(addDays(now,-i));out.push({l:DAYS[d.getDay()]+' '+d.getDate(),s:d,e:d});}}
  else if(mode==='week'){const ws=weekStart(now);for(let i=7;i>=0;i--){const s=addDays(ws,-7*i);out.push({l:i===0?'Tuần này':dm(s),s,e:addDays(s,6)});}}
  else{for(let i=5;i>=0;i--){const s=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({l:'Th'+(s.getMonth()+1),s,e:new Date(s.getFullYear(),s.getMonth()+1,0)});}}
  return out;
}

function toggleTask(id){
  const now=new Date(),dk=keyOf(now),kid=activeKid();
  state.done[dk]=state.done[dk]||{};
  const arr=state.done[dk][kid.id]=state.done[dk][kid.id]||[];
  const i=arr.indexOf(id),added=i<0;
  if(added)arr.push(id);else arr.splice(i,1);
  save();ui.pop=added?id:null;render();
  if(!added)return;
  sfx('pop');
  const ds=new Set(arr);
  const list=tasksFor(kid.id,ui.period,now);
  if(list.length&&list.every(t=>ds.has(t.id))){
    const all=PERIODS.every(p=>tasksFor(kid.id,p.id,now).every(t=>ds.has(t.id)));
    setTimeout(()=>celebrate(all?'day':'period'),450);
  }
}
root.addEventListener('click',e=>{

  else if(a==='period'){ui.period=b.dataset.p;render();}
  else if(a==='kid'){state.active=b.dataset.id;save();render();}
  else if(a==='lock')openPin();

  else if(a==='review'){const n=new Date();ui.view='review';ui.rtab='hist';ui.month={y:n.getFullYear(),m:n.getMonth()};ui.sel=keyOf(n);render();window.scrollTo(0,0);}
  else if(a==='back'){ui.view='today';render();window.scrollTo(0,0);}

  else if(a==='rmonth'){

    if(m<0){m=11;y--;}if(m>11){m=0;y++;}

    ui.month={y,m};render();

});

/* ---------- đồng hồ và chuông báo ---------- */
function tick(){
  const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  const c=$('#clock');if(c&&c.textContent!==hm)c.textContent=hm;
  if(hm===lastMin)return;
  lastMin=hm;
  const dk=keyOf(now);
  if(dk!==curDay){curDay=dk;curAuto=periodAt(now);ui.period=curAuto;if(!pp&&ovType!=='pin')render();}
  else{const p=periodAt(now);if(p!==curAuto){curAuto=p;ui.period=p;if(!pp&&ovType!=='pin')render();}}
  if(pp||ovType==='pin')return;
  const nowMin=now.getHours()*60+now.getMinutes(),wd=now.getDay();
  state.reminders.forEach(r=>{
    if(!r.on||!(r.days||ALL).includes(wd))return;
    const tp=String(r.time||'').split(':');if(tp.length<2)return;
    const m=nowMin-((+tp[0])*60+(+tp[1])),rep=+r.repeat||0;
    if(m<0||!(m===0||(rep>0&&m%rep===0&&m<=rep*REM_REPEATS)))return;
    const key=dk+'|'+m;
    if(fired[r.id]===key)return;
    fired[r.id]=key;saveFired();fireReminder(r,false);
  });
  if(state.taskRemind){
    const secs=[];
    state.kids.forEach(k=>{
      const ds=new Set(doneIds(dk,k.id)),key=dk+'|'+hm;
      const l=state.tasks.filter(t=>t.time===hm&&(t.kid==='all'||t.kid===k.id)&&t.days.includes(wd)&&!ds.has(t.id));
      if(l.length&&fired['task|'+k.id]!==key){fired['task|'+k.id]=key;secs.push({kid:k,list:l});}
    });
    if(secs.length){
      saveFired();
      const names=secs.map(x=>x.kid.name).join(' và ');
      showRemind(secs,periodAt(now),'Đến giờ làm việc rồi, '+names+'!','Việc này đến giờ rồi, con làm ngay nhé:','Đến giờ làm việc rồi '+names+' ơi. '+secs[0].list.slice(0,3).map(t=>t.title).join(', '));
    }
  }
}

/* ---------- xử lý sự kiện của bố mẹ ---------- */
function b64(s){const b=new TextEncoder().encode(s);let r='';b.forEach(x=>{r+=String.fromCharCode(x);});return btoa(r);}
function unb64(s){const r=atob(s.trim());return new TextDecoder().decode(Uint8Array.from(r,c=>c.charCodeAt(0)));}
let cfTimer=null;
function askConfirm(key){pp.confirm=key;renderSheet();clearTimeout(cfTimer);cfTimer=setTimeout(()=>{if(pp&&pp.confirm===key){pp.confirm=null;renderSheet();}},4000);}
function swap(id,dir){
  const i=state.tasks.findIndex(t=>t.id===id);if(i<0)return;
  const per=state.tasks[i].period;let j=i+dir;
  while(j>=0&&j<state.tasks.length&&state.tasks[j].period!==per)j+=dir;
  if(j<0||j>=state.tasks.length)return;
  const x=state.tasks[i];state.tasks[i]=state.tasks[j];state.tasks[j]=x;save();renderSheet();
}
function pa(a,d){
  switch(a){
    case 'close':closeSheet();return;
    case 'fbgen':{const el=$('#fb-code',sheet);if(el)el.value=genCode();return;}
    case 'fbsave':{
      const say2=t=>{const m=$('#fb-msg',sheet);if(m)m.textContent=t;};
      const code=((($('#fb-code',sheet)||{}).value)||'').trim().toLowerCase();
      const txt=((($('#fb-cfg',sheet)||{}).value)||'').trim();
      let cfg=readFb().cfg||BAKED_FB;
      if(txt){cfg=parseFbConfig(txt);if(!cfg){say2('Chưa đọc được cấu hình. Hãy dán cả đoạn firebaseConfig, có apiKey và projectId.');return;}}
      if(!cfg){say2('Hãy dán cấu hình Firebase trước.');return;}
      if(!/^[a-z0-9_-]{6,40}$/.test(code)){say2('Mã gia đình gồm 6 đến 40 ký tự: chữ thường không dấu, số, dấu - hoặc _.');return;}
      writeFb({cfg,code});say2('Đã lưu. Đang tải lại để kết nối...');setTimeout(()=>location.reload(),700);return;
    }
    case 'fbcopy':{
      const link=fbLink(),ta=$('#fb-link',sheet);
      const fallback=()=>{if(ta){ta.focus();ta.select();}const m=$('#fb-msg',sheet);if(m)m.textContent='Hãy giữ vào ô link và chọn Sao chép.';};
      try{navigator.clipboard.writeText(link).then(()=>{const m=$('#fb-msg',sheet);if(m)m.textContent='Đã sao chép link.';},fallback);}catch(e){fallback();}
      return;
    }
    case 'fbclear':
      if(pp.confirm==='fbclear'){writeFb(null);pp.confirm=null;const m=$('#fb-msg',sheet);if(m)m.textContent='Đã ngắt kết nối. Đang tải lại...';setTimeout(()=>location.reload(),700);}
      else askConfirm('fbclear');
      return;
    case 'tab':pp.tab=d.tab;pp.form=null;pp.msg='';pp.confirm=null;renderSheet();return;
    case 'addtask':pp.form={id:null,title:'',icon:'star',period:ui.period,time:'',days:ALL.slice(),kid:'all'};pp.msg='';renderSheet();return;
    case 'edittask':{const t=state.tasks.find(x=>x.id===d.id);if(!t)return;pp.form={id:t.id,title:t.title,icon:t.icon,period:t.period,time:t.time||'',days:t.days.slice(),kid:t.kid};pp.msg='';renderSheet();return;}
    case 'deltask':
      if(pp.confirm==='del:'+d.id){state.tasks=state.tasks.filter(t=>t.id!==d.id);pp.confirm=null;save();pp.msg='Đã xóa việc.';renderSheet();}
      else askConfirm('del:'+d.id);
      return;
    case 'up':swap(d.id,-1);return;
    case 'down':swap(d.id,1);return;
    case 'ficon':pp.form.icon=d.icon;renderSheet();return;
    case 'fperiod':pp.form.period=d.p;renderSheet();return;
    case 'fday':{const n=+d.d,f=pp.form;f.days=f.days.includes(n)?f.days.filter(x=>x!==n):f.days.concat(n);renderSheet();return;}
    case 'fpreset':pp.form.days=d.preset==='all'?ALL.slice():(d.preset==='school'?[1,2,3,4,5]:[0,6]);renderSheet();return;
    case 'ftimeclear':pp.form.time='';renderSheet();return;
    case 'fcancel':pp.form=null;pp.msg='';renderSheet();return;
    case 'fsave':{
      const f=pp.form,title=f.title.trim();
      if(!title){pp.msg='Hãy nhập tên việc trước khi lưu.';renderSheet();return;}
      if(!f.days.length){pp.msg='Hãy chọn ít nhất một ngày trong tuần.';renderSheet();return;}
      const rec={title,icon:f.icon,period:f.period,time:f.time||'',days:f.days.slice(),kid:f.kid};
      if(f.id){const t=state.tasks.find(x=>x.id===f.id);if(t)Object.assign(t,rec);}
      else state.tasks.push(Object.assign({id:'t'+uid()},rec));
      save();pp.form=null;pp.msg='Đã lưu việc "'+title+'".';renderSheet();return;
    }
    case 'addkid':{
      if(state.kids.length>=4)return;
      const used=state.kids.map(k=>k.color),c=['b','g','p','r','y'].find(x=>!used.includes(x))||'b';
      state.kids.push({id:'k'+uid(),name:'Bé '+(state.kids.length+1),color:c});save();pp.msg='Đã thêm bé. Hãy đổi tên bé.';renderSheet();return;
    }
    case 'kcolor':{const k=state.kids.find(x=>x.id===d.id);if(k){k.color=d.c;save();document.body.dataset.kc=activeKid().color;renderSheet();}return;}
    case 'delkid':
      if(pp.confirm==='delkid:'+d.id){
        state.kids=state.kids.filter(k=>k.id!==d.id);
        state.tasks=state.tasks.filter(t=>t.kid!==d.id);
        Object.keys(state.done).forEach(k=>{delete state.done[k][d.id];});
        if(state.active===d.id)state.active=state.kids[0].id;
        pp.confirm=null;save();pp.msg='Đã xóa bé và các việc riêng của bé.';renderSheet();
      }else askConfirm('delkid:'+d.id);
      return;
    case 'addrem':state.reminders.push({id:'r'+uid(),time:'07:00',period:'morning',on:true,days:ALL.slice(),kid:'all',repeat:0,msg:''});save();pp.msg='';renderSheet();return;
    case 'rday':{
      const r=state.reminders.find(x=>x.id===d.id);if(!r)return;
      const n=+d.d,has=r.days.includes(n);
      if(has&&r.days.length===1){note('Cần chọn ít nhất một ngày trong tuần.');return;}
      r.days=has?r.days.filter(x=>x!==n):r.days.concat(n);save();renderSheet();return;
    }
    case 'testrem':{const r=state.reminders.find(x=>x.id===d.id);if(r){unlock();fireReminder(r,true);}return;}
    case 'delrem':
      if(pp.confirm==='delrem:'+d.id){state.reminders=state.reminders.filter(r=>r.id!==d.id);pp.confirm=null;save();renderSheet();}
      else askConfirm('delrem:'+d.id);
      return;
    case 'savepin':{
      const v=($('#pin-new',sheet)||{}).value||'';
      if(!/^\d{4}$/.test(v)){note('Mã PIN phải gồm đúng 4 chữ số.');return;}
      state.pin=v;save();note('Đã đổi mã PIN.');return;
    }
    case 'gencode':{
      const o={v:1,pin:state.pin,kids:state.kids,tasks:state.tasks,reminders:state.reminders,reward:state.reward,money:state.money,showMoney:state.showMoney,sound:state.sound,speak:state.speak,taskRemind:state.taskRemind};
      pp.code='BTL1:'+b64(JSON.stringify(o));pp.msg='Đã tạo mã. Hãy sao chép rồi dán sang thiết bị khác.';renderSheet();return;
    }
    case 'copycode':{
      const ta=$('#code-out',sheet);
      const fallback=()=>{if(ta){ta.focus();ta.select();}note('Hãy giữ vào ô mã và chọn Sao chép.');};
      try{navigator.clipboard.writeText(pp.code).then(()=>note('Đã sao chép mã.'),fallback);}catch(e){fallback();}
      return;
    }
    case 'importcode':{
      const raw=(($('#code-in',sheet)||{}).value||'').trim();
      try{
        if(raw.indexOf('BTL1:')!==0)throw new Error('format');
        const o=JSON.parse(unb64(raw.slice(5)));
        if(!o||!Array.isArray(o.kids)||!o.kids.length||!Array.isArray(o.tasks))throw new Error('data');
        const n=normalize(Object.assign({},state,o,{done:state.done,plan:state.plan,snap:state.snap,paid:state.paid}));
        Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,n);
        save();note('Đã nhập cài đặt thành công.');
      }catch(e){note('Mã không hợp lệ. Hãy sao chép lại toàn bộ mã, bắt đầu từ BTL1:');}
      return;
    }
    case 'resettoday':{const dk=keyOf(new Date());if(state.done[dk])delete state.done[dk][d.id];save();queueDay(dk);note('Đã bỏ các dấu tick của hôm nay.');return;}
    case 'resetall':
      if(pp.confirm==='reset'){
        const n=defaults();Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,n);
        save();pp.confirm=null;note('Đã về cài đặt ban đầu.');
      }else askConfirm('reset');
      return;
  }
}
function pi(t,commit){
  const id=t.dataset.id,k=t.dataset.pi;
  switch(k){
    case 'ftitle':pp.form.title=t.value;return;
    case 'ftime':pp.form.time=t.value;return;
    case 'fkid':pp.form.kid=t.value;return;
    case 'kidfilter':pp.kidFilter=t.value;if(commit)renderSheet();return;
    case 'kname':{const kd=state.kids.find(x=>x.id===id);if(kd){kd.name=t.value.trim()||'Bé';save();}if(commit)renderSheet();return;}
    case 'rtime':{const r=state.reminders.find(x=>x.id===id);if(r&&t.value){r.time=t.value;save();}return;}
    case 'rperiod':{const r=state.reminders.find(x=>x.id===id);if(r){r.period=t.value;save();}return;}
    case 'rkid':{const r=state.reminders.find(x=>x.id===id);if(r){r.kid=t.value;save();}return;}
    case 'rrepeat':{const r=state.reminders.find(x=>x.id===id);if(r){r.repeat=+t.value||0;save();}return;}
    case 'rmsg':{const r=state.reminders.find(x=>x.id===id);if(r){r.msg=t.value;save();}return;}
    case 'taskremind':state.taskRemind=t.checked;save();return;
    case 'ron':{const r=state.reminders.find(x=>x.id===id);if(r){r.on=t.checked;save();}return;}
    case 'sound':state.sound=t.checked;save();return;
    case 'speak':state.speak=t.checked;save();return;
    case 'rtext':state.reward.text=t.value;save();return;
    case 'rtarget':{const n=parseInt(t.value,10);if(n>=1&&n<=500){state.reward.target=n;save();}return;}
    case 'mrate':{const n=parseInt(t.value,10);state.money.rate=n>=0?n:0;save();return;}
    case 'mcap':{const n=parseInt(t.value,10);state.money.cap=n>=0?n:0;save();return;}
    case 'mbonus':{const n=parseInt(t.value,10);state.money.bonus=n>=0?n:0;save();return;}
    case 'showmoney':state.showMoney=t.checked;save();return;
    case 'paid':if(t.checked)state.paid[t.dataset.key]=true;else delete state.paid[t.dataset.key];save();return;
  }
}
sheet.addEventListener('click',e=>{const b=e.target.closest('[data-pa]');if(b&&pp)pa(b.dataset.pa,b.dataset);});
sheet.addEventListener('input',e=>{const t=e.target;if(pp&&t.dataset&&t.dataset.pi)pi(t,false);});
sheet.addEventListener('change',e=>{const t=e.target;if(pp&&t.dataset&&t.dataset.pi)pi(t,true);});

/* bàn phím: Esc để đóng, gõ số để nhập PIN */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!overlay.hidden){hideOv();return;}
    if(ui.view==='review'&&!pp){ui.view='today';render();return;}
    if(pp&&!pp.form)closeSheet();
    return;
  }
  if(ovType==='pin'){
    if(/^\d$/.test(e.key))pinPress(e.key);
    else if(e.key==='Backspace'){pinBuf=pinBuf.slice(0,-1);pinErr=false;setHTML(overlay,pinHTML());}
  }
});

/* ================= khởi động ================= */
render();
tick();
setInterval(tick,1000);
initSync();
})();
</script>
